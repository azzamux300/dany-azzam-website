<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dany Azzam Cars</title>
<meta name="description" content="Dany Azzam Cars for All: clean-Carfax American cars in Lebanon. سيارات أميركية، كارفاكس نظيف.">
<meta property="og:title" content="Dany Azzam Cars">
<meta property="og:description" content="Clean-Carfax American cars in Lebanon · سيارات أميركية، كارفاكس نظيف">
<meta property="og:image" content="cars/bmw/01.jpg">
<meta name="theme-color" content="#000000">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600&family=Josefin+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: two views. Home = 3D intro, why-us, collection teaser, footer. Collection = blurred photo hero, search, car cards. Single black theme by design. */
:root{
  --bg:#000000; --surface:#0D0D0E; --raise:#161617; --ink:#FFFFFF; --soft:#BDBDC2; --muted:#8C8C90; --line:#242426; --wa:#25A55F; --ok:#7FD39B;
  --latin:"Josefin Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --arabic:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--arabic);font-size:17px;line-height:1.6;overflow-x:clip}
html[lang="en"] body{font-family:var(--latin)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap > *{min-width:0}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.eyebrow{color:var(--muted);font-size:.75rem;letter-spacing:.28em;font-family:var(--latin);text-transform:uppercase}
h2.title{font-weight:300;font-size:clamp(1.8rem,5vw,2.6rem);margin:0;line-height:1.2}
html[lang="en"] h2.title{text-transform:uppercase;letter-spacing:.14em;font-size:clamp(1.4rem,4vw,2rem)}

/* Header */
.top{position:fixed;top:env(safe-area-inset-top,0px);inset-inline:0;z-index:8;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.top.solid{background:rgba(0,0,0,.82);backdrop-filter:blur(12px);border-color:var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;direction:ltr}
.brand{display:block;line-height:0}
.brand img{height:22px;width:auto}
.nav{display:flex;align-items:center;gap:6px}
.nav a{text-decoration:none;font-size:.9rem;padding:8px 12px;border-radius:999px;color:var(--soft)}
.nav a[aria-current="page"]{color:var(--ink)}
.lang{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;font-family:var(--latin);font-weight:600}
html[lang="en"] .lang{font-family:var(--arabic)}
@media (max-width:520px){.nav a.hide-sm{display:none}}

/* Intro */
.intro{position:relative;min-height:92svh;display:grid;place-items:center;overflow:hidden;perspective:1100px;isolation:isolate}
#warp{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.intro::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at center,transparent 30%,#000 78%)}
.stage{display:grid;justify-items:center;gap:22px;width:min(560px,86vw);transform-style:preserve-3d;padding-block:90px 40px}
.logo3d{position:relative;width:100%;transform-style:preserve-3d;will-change:transform}
.logo3d img{display:block;width:100%;height:auto}
.swoosh{animation:fly 1.8s cubic-bezier(.16,.84,.24,1) .2s both}
.word{margin-top:4%;animation:fly 1.8s cubic-bezier(.16,.84,.24,1) .55s both,glow 1.6s ease-in-out 2.4s forwards}
@keyframes glow{0%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}45%{filter:drop-shadow(0 0 14px rgba(255,255,255,.55))}100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}}
@keyframes fly{0%{transform:translateZ(-1600px) rotateY(38deg) rotateX(14deg);filter:blur(14px);opacity:0}60%{filter:blur(0);opacity:1}100%{transform:none;filter:blur(0);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}100%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.tag{margin:0;color:var(--muted);letter-spacing:.06em;text-align:center;animation:rise .9s ease 2s both}
html[lang="en"] .tag{text-transform:uppercase;letter-spacing:.32em;font-size:.8rem}
.go{position:relative;display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:#000;border:0;border-radius:999px;padding:14px 28px;min-height:56px;font-weight:600;font-size:1.05rem;text-decoration:none;overflow:hidden}
.stage .go{animation:rise .9s ease 2.25s both}
.go svg{width:18px;height:18px;transition:transform .3s}
html[dir="rtl"] .go svg{transform:scaleX(-1)}
.go:hover svg{transform:translateX(4px)}
html[dir="rtl"] .go:hover svg{transform:scaleX(-1) translateX(4px)}
.stage .go::after{content:"";position:absolute;inset:-2px;border-radius:inherit;animation:pulse 2.4s ease-out 3.2s infinite}
.scroll{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;color:var(--muted);font-family:var(--latin);font-size:.7rem;letter-spacing:.3em;animation:rise .9s ease 2.6s both}

/* Why us */
.why{padding-block:88px 72px}
.why .head{display:grid;gap:8px;justify-items:center;text-align:center;margin-bottom:40px}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
@media (max-width:760px){.pillars{grid-template-columns:1fr}}
.pillar{background:var(--bg);padding:34px 28px;display:grid;gap:12px;align-content:start;transition:background .3s}
.pillar:hover{background:var(--surface)}
.pillar .ic{width:52px;height:52px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:grid;place-items:center}
.pillar .ic svg{width:24px;height:24px}
.pillar h3{margin:6px 0 0;font-weight:600;font-size:1.2rem}
html[lang="en"] .pillar h3{font-family:var(--latin);letter-spacing:.04em}
.pillar p{margin:0;color:var(--soft);font-size:.95rem}

/* Collection teaser */
.teaser{position:relative;overflow:hidden;isolation:isolate;border-block:1px solid var(--line)}
.teaser .bgimg{position:absolute;inset:0;z-index:-2;background:url(bg/porsche.jpg) center 55%/cover;transform:scale(1.05)}
.teaser::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.6) 55%,rgba(0,0,0,.25) 100%)}
html[dir="rtl"] .teaser::after{background:linear-gradient(270deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.6) 55%,rgba(0,0,0,.25) 100%)}
.teaser .wrap{padding-block:96px;display:grid;gap:16px;justify-items:start}
.teaser p{margin:0;color:var(--soft);max-width:40ch}
.teaser .count{font-family:var(--latin);font-size:.85rem;letter-spacing:.2em;color:var(--soft);text-transform:uppercase}

/* Collection page */
.chero{position:relative;overflow:hidden;isolation:isolate;min-height:56svh;display:grid;align-items:end}
.chero .bgimg{position:absolute;inset:-30px;z-index:-2;background:url(bg/porsche.jpg) center 50%/cover;filter:blur(7px) saturate(1.15);transform:scale(1.06)}
.chero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.45) 55%,#000 100%)}
.chero .wrap{width:100%;padding-block:120px 36px;display:grid;gap:12px}
.chero p{margin:0;color:var(--soft)}
.searchbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.searchbar .wrap{padding-block:12px;display:flex;align-items:center;gap:12px}
.sfield{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:52px}
.sfield:focus-within{border-color:#5a5a5e}
.sfield svg{width:20px;height:20px;color:var(--muted);flex:none}
.sfield input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font-size:1rem;outline:none;padding:12px 0}
.sfield input::placeholder{color:var(--muted)}
.found{color:var(--muted);font-size:.85rem;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:26px;padding-block:32px 72px;perspective:1200px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}

/* Card */
.card{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:transform .25s ease-out,border-color .3s;will-change:transform}
.card:hover{border-color:#3d3d40}
.card:focus-visible{outline:2px solid #fff;outline-offset:3px}
.cimg{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:#111}
.cimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease}
.card:hover .cimg img{transform:scale(1.05)}
.cimg::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.chip{position:absolute;z-index:1;top:12px;inset-inline-start:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 12px 4px 8px;font-family:var(--latin);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.chip svg{width:16px;height:16px;color:var(--ok)}
.pcount{position:absolute;z-index:1;bottom:12px;inset-inline-end:12px;display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:#E6E6E8}
.pcount svg{width:16px;height:16px}
.cbody{padding:18px 20px 20px;display:grid;gap:14px}
.cname{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cname b{font-family:var(--latin);font-weight:600;font-size:1.3rem;letter-spacing:.02em}
.cname span{font-family:var(--latin);color:var(--muted);font-size:1rem;white-space:nowrap}
.odo{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:.95rem;direction:ltr;justify-content:flex-start}
html[dir="rtl"] .odo{justify-content:flex-end}
.odo svg{width:20px;height:20px;flex:none}
.odo small{color:var(--muted);font-size:.8rem}
.cfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.cprice{font-family:var(--latin);font-weight:600;font-size:1.5rem;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.arrow{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;transition:background .25s,color .25s}
.arrow svg{width:18px;height:18px}
html[dir="rtl"] .arrow svg{transform:scaleX(-1)}
.card:hover .arrow{background:#fff;color:#000}

/* Detail */
.detail{position:fixed;inset:0;z-index:30;background:#000;overflow-y:auto;overscroll-behavior:contain}
.dbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.dbar span{color:var(--muted);font-size:.85rem;direction:ltr}
.dclose{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;min-height:44px;padding:4px 16px}
.dwrap{max-width:900px;margin:0 auto}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;direction:ltr;aspect-ratio:4/3;max-height:70svh;width:100%;background:#0a0a0a}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;direction:ltr}
.thumbs button{flex:none;width:58px;height:58px;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;background:none;opacity:.5}
.thumbs button[aria-current="true"]{border-color:#fff;opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.dinfo{padding:16px max(16px,env(safe-area-inset-left,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.feats{display:flex;flex-wrap:wrap;gap:6px}
.feats span{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:3px 11px;color:#CFCFD3}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.specs div{background:var(--surface);padding:10px 14px}
.specs span{display:block;font-size:.75rem;color:var(--muted)}
.specs b{font-weight:400}
.btns{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--ink)}
.btn.solid{background:var(--wa);border-color:var(--wa);color:#fff}
.btn svg{width:20px;height:20px;flex:none}

/* Footer */
.site-foot{border-top:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:1.3fr 1fr 1.2fr 1fr;gap:36px 28px;padding-block:56px 40px}
@media (max-width:820px){.fgrid{grid-template-columns:1fr 1fr}.fbrand{grid-column:1/-1}}
@media (max-width:440px){.fgrid{grid-template-columns:1fr}}
.fbrand img{width:200px;max-width:100%;display:block}
.fbrand p{color:var(--soft);margin:16px 0 0;max-width:30ch}
.fcol h4{margin:0 0 16px;font-family:var(--latin);font-weight:400;font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;color:#D8D8DC}
html[dir="rtl"] .fcol h4{font-family:var(--arabic);letter-spacing:.04em;font-size:.95rem;font-weight:600}
.fcol ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.fcol a{text-decoration:none;color:var(--ink);display:inline-flex;align-items:flex-start;gap:12px;transition:color .2s}
.fcol a:hover{color:var(--soft)}
.fcol svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--soft)}
.ltr{direction:ltr;unicode-bidi:isolate}
.fbottom{border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding-block:20px calc(24px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.85rem}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}html{scroll-behavior:auto}}
</style>
</head>

  if(!reduce)document.querySelectorAll(".card").forEach(el=>{
    el.onpointermove=e=>{if(e.pointerType!=="mouse")return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform="rotateY("+(x*8)+"deg) rotateX("+(-y*6)+"deg) translateZ(4px)"};
    el.onpointerleave=()=>el.style.transform="";
  });
}
function render(){
  const t=T[lang],d=document.documentElement;d.lang=lang;d.dir=t.dir;
  $("langBtn").textContent=t.lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);
  $("q").placeholder=t.search;
  $("teaserCount").textContent=t.avail(CARS.length);
  $("pillars").innerHTML=t.why.map(w=>'<div class="pillar"><div class="ic">'+I[w[2]]+'</div><h3>'+w[0]+'</h3><p>'+w[1]+'</p></div>').join("");
  const li=(h,ic,txt,cls,blank)=>'<li><a href="'+h+'"'+(blank?' target="_blank" rel="noopener"':'')+'>'+(ic||'')+'<span class="'+(cls||'')+'">'+txt+'</span></a></li>';
  $("fQuickList").innerHTML=li("#home","",t.home)+li("#collection","",t.colTitle)+li("#contact","",t.fContact);
  $("fContactList").innerHTML=li(MAP,I.pin,t.locTxt,"",1)+li("tel:+"+PHONE,I.ph,"(+961) "+PHONE_TXT,"ltr")+li(wa(lang==="ar"?"مرحبا":"Hello"),I.wa,t.wa+' · <span class="ltr">'+PHONE_TXT+'</span>',"",1);
  $("fFollowList").innerHTML=li(IG,I.ig,t.ig,"",1)+li(FB,I.fb,t.fb,"",1)+li(TT,I.tt,t.tt,"",1);
  drawGrid();
}

function openCar(i){
  const c=CARS[i],t=T[lang],g=document.createElement("div");
  g.className="detail";g.setAttribute("role","dialog");g.setAttribute("aria-modal","true");g.setAttribute("aria-label",fullName(c));
  const vals=[c.year,val(c,"color"),val(c,"interior"),c.engine,fmt(c.km)+" km · "+fmt(c.mi)+" mi",val(c,"gear")];
  g.innerHTML='<div class="dbar"><span id="gpos">1 / '+c.photos.length+'</span><button class="dclose" id="dclose">'+t.close+'</button></div><div class="dwrap">'+
   '<div class="track" id="track">'+c.photos.map((p,j)=>'<img src="'+p+'" alt="'+fullName(c)+' '+(j+1)+'"'+(j>1?' loading="lazy"':'')+'>').join("")+'</div>'+
   '<div class="thumbs" id="thumbs">'+c.photos.map((p,j)=>'<button data-j="'+j+'" aria-current="'+(j===0)+'" aria-label="'+(j+1)+'"><img src="'+p+'" alt="" loading="lazy"></button>').join("")+'</div>'+
   '<div class="dinfo"><span class="chip" style="position:static;justify-self:start">'+I.check+t.clean+'</span>'+
   '<h3 class="cname"><b>'+c.name+'</b>'+(sub(c)?'<span>'+sub(c)+'</span>':'')+'</h3>'+
   '<div class="cfoot" style="border:0;padding:0"><span class="cprice">$'+fmt(c.price)+'</span></div>'+
   '<div class="feats">'+c.feats[lang].map(f=>"<span>"+f+"</span>").join("")+'</div>'+
   '<div class="specs">'+t.specs.map((s,j)=>"<div><span>"+s+"</span><b"+(j===4||j===3?' class="ltr"':'')+">"+(vals[j]||t.tbd)+"</b></div>").join("")+'</div>'+
   '<div class="btns"><a class="btn solid" target="_blank" rel="noopener" href="'+wa(t.msg(carLine(c)))+'">'+I.wa+t.ask+'</a><a class="btn" href="tel:+'+PHONE+'">'+I.ph+t.call+'</a></div></div></div>';
  document.body.appendChild(g);document.body.style.overflow="hidden";
  const tr=$("track"),th=$("thumbs"),close=()=>{g.remove();document.body.style.overflow=""};
  $("dclose").onclick=close;$("dclose").focus();
  g.addEventListener("keydown",e=>{if(e.key==="Escape")close();if(e.key==="ArrowRight")tr.scrollBy({left:tr.clientWidth});if(e.key==="ArrowLeft")tr.scrollBy({left:-tr.clientWidth})});
  th.onclick=e=>{const b=e.target.closest("[data-j]");if(b)tr.scrollTo({left:+b.dataset.j*tr.clientWidth,behavior:reduce?"auto":"smooth"})};
  let last=0;tr.addEventListener("scroll",()=>{const j=Math.round(tr.scrollLeft/tr.clientWidth);if(j===last)return;last=j;
    $("gpos").textContent=(j+1)+" / "+c.photos.length;
    th.querySelectorAll("button").forEach((b,k)=>b.setAttribute("aria-current",k===j));
    th.children[j]&&th.children[j].scrollIntoView({block:"nearest",inline:"center"})},{passive:true});
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-car]");if(b)openCar(+b.dataset.car)});
$("q").addEventListener("input",drawGrid);
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("da-lang",lang)}catch(e){}render()};

/* routing */
function route(){
  const h=location.hash.slice(1),col=h==="collection";
  if(h==="contact"){ $("contact").scrollIntoView({behavior:reduce?"auto":"smooth"});return }
  $("viewHome").hidden=col;$("viewCol").hidden=!col;
  $("navHome").setAttribute("aria-current",col?"false":"page");$("navCol").setAttribute("aria-current",col?"page":"false");
  scrollTo(0,0);onScroll();
}
addEventListener("hashchange",route);

/* header + logo depth on scroll */
const logo=$("logo");
function onScroll(){
  const y=scrollY,h=innerHeight,home=!$("viewHome").hidden;
  $("top").classList.toggle("solid",!home||y>h*.5);
  if(reduce||!home)return;
  const p=Math.min(y/h,1);
  logo.style.transform="translateZ("+(-p*600)+"px) rotateX("+(p*35)+"deg)";logo.style.opacity=1-p*.9;
}
addEventListener("scroll",onScroll,{passive:true});

/* warp streaks */
(function(){
  const c=$("warp"),x=c.getContext("2d");let W,H,S=[],run=true,boost=3;
  function size(){W=c.width=c.offsetWidth*devicePixelRatio;H=c.height=c.offsetHeight*devicePixelRatio}
  function spawn(s){s.a=Math.random()*Math.PI*2;s.z=Math.random()+.02;s.v=.004+Math.random()*.01;return s}
  size();addEventListener("resize",size);
  for(let i=0;i<160;i++)S.push(spawn({}));
  function frame(){
    if(!run)return;
    x.fillStyle="rgba(0,0,0,.35)";x.fillRect(0,0,W,H);
    const cx=W/2,cy=H*.46,R=Math.max(W,H)*.75;boost=Math.max(1,boost*.985);
    for(const s of S){const r0=s.z*s.z*R;s.z+=s.v*boost;const r1=s.z*s.z*R;
      if(r0>R){spawn(s);s.z=.02;continue}
      x.strokeStyle="rgba(255,255,255,"+Math.min(.55,s.z*.6)+")";x.lineWidth=Math.max(.6,s.z*2.2)*devicePixelRatio;
      x.beginPath();x.moveTo(cx+Math.cos(s.a)*r0,cy+Math.sin(s.a)*r0);x.lineTo(cx+Math.cos(s.a)*r1,cy+Math.sin(s.a)*r1);x.stroke()}
    requestAnimationFrame(frame);
  }
  if(reduce){x.fillStyle="#000";x.fillRect(0,0,W,H);return}
  new IntersectionObserver(e=>{const v=e[0].isIntersecting;if(v&&!run){run=true;size();frame()}else if(!v)run=false}).observe(c);
  frame();
})();
render();route();
</script>
